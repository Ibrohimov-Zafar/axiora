# HTTPS — production (certbot sertifikatlari bilan)
upstream axiora_app {
    server 127.0.0.1:8088;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name axiora-team.com www.axiora-team.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name axiora-team.com www.axiora-team.com;

    ssl_certificate /etc/letsencrypt/live/axiora-team.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axiora-team.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://axiora_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
