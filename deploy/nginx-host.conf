# Host nginx konfiguratsiyasi (VPS dagi asosiy nginx uchun)
# Faylni nusxalang:
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/axiora-team.com
#   sudo ln -sf /etc/nginx/sites-available/axiora-team.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker container 127.0.0.1:8088 da ishlaydi (port 80 band bo'lsa ham muammo yo'q)

server {
    listen 80;
    listen [::]:80;
    server_name axiora-team.com www.axiora-team.com;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

