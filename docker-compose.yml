services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/axiora.db
      - SITE_URL=https://axiora-team.com
      - CORS_ORIGIN=https://axiora-team.com,https://www.axiora-team.com
    volumes:
      - ./data:/app/data
    ports:
      # Faqat localhost — tashqi nginx :80 orqali yo'naltiradi (port to'qnashuvi bo'lmaydi)
      - "127.0.0.1:8088:3001"
