name: Deploy Axiora

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-axiora-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd /var/axiora
            git fetch origin
            git reset --hard origin/main
            bash deploy/deploy.sh
